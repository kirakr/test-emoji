<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Cosmic Tycoon - Mutation Pod Edition</title>
    <style>
        :root { 
            --neon: #0f8; --accent: #a335ee; --gold: #ffeb3b; --gray: #444; --danger: #ff4444; 
            --bg: rgba(5,5,15,0.95); --lucky: #00ffff;
            font-size: 1.5vh; 
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Arial Black', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gui-layer { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            pointer-events: none; color: white; z-index: 100; 
        }
        
        .hud { 
            position: absolute; top: 3vh; left: 2vw; 
            background: transparent; padding: 2vh; border-left: 0.5vh solid var(--neon); 
            pointer-events: auto; border-radius: 0 2vh 2vh 0; min-width: 18vw;
        }
        .hud-value { font-size: 2.2rem; font-weight: 900; }
        #fever-timer { font-size: 1.2rem; margin-top: 1vh; font-weight: bold; }
        #box-timer { font-size: 1.1rem; margin-top: 0.5vh; color: var(--lucky); font-weight: bold; }
        #mutation-timer-hud { font-size: 1.1rem; margin-top: 0.5vh; color: #e91e63; font-weight: bold; }

        .top-right-area { position: absolute; top: 3vh; right: 2vw; pointer-events: auto; }
        #settings-toggle { 
            background: #222; color: white; border: 0.3vh solid #444; 
            width: 8vh; height: 8vh; 
            border-radius: 2vh; cursor: pointer; font-size: 4vh; transition: 0.3s;
        }
        #settings-menu {
            position: absolute; top: 9vh; right: 0; background: var(--bg); border: 0.3vh solid var(--accent);
            padding: 2vh; border-radius: 2vh; display: none; flex-direction: column; gap: 1.5vh; min-width: 15vw;
        }
        .menu-btn { width: 100%; padding: 1.5vh; border: none; border-radius: 1vh; cursor: pointer; font-weight: 900; color: white; font-size: 1.2rem; transition: 0.3s; }
        
        .volume-control { display: flex; flex-direction: column; gap: 0.5vh; padding: 0.5vh 0; }
        .volume-control label { font-size: 0.8rem; color: var(--gold); display: flex; justify-content: space-between; }
        .volume-control input { cursor: pointer; accent-color: var(--neon); }

        #discard-btn {
            position: absolute; bottom: 22vh; left: 50%; transform: translateX(-50%);
            background: linear-gradient(#ff4444, #990000); color: white;
            border: 0.3vh solid white; padding: 2vh 5vw; font-size: 1.8rem; font-weight: 900;
            border-radius: 5vh; cursor: pointer; pointer-events: auto; display: none; z-index: 200;
        }

        .collect-area { position: absolute; right: 3vw; bottom: 5vh; pointer-events: auto; }
        #collect-all-btn { 
            background: radial-gradient(circle, var(--gold), #f9a825);
            border: 0.5vh solid #fff; width: 22vh; height: 22vh; 
            font-size: 1.8rem; font-weight: 900; color: #331a00; cursor: pointer; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 3vh rgba(255,235,59,0.3);
        }

        .controls { position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%); pointer-events: auto; text-align: center; }
        #rebirth-btn { padding: 2vh 6vw; font-size: 2rem; font-weight: 900; border-radius: 2vh; border: none; transition: 0.3s; }
        #rebirth-btn.available { background: var(--neon); color: #000; box-shadow: 0 0 3vh var(--neon); cursor: pointer; }
        #rebirth-btn.locked { background: var(--gray); color: #888; cursor: not-allowed; opacity: 0.6; }
        
        .window-base { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80vw; height: 70vh; background: var(--bg); border: 0.3vh solid var(--accent); 
            display: none; flex-direction: column; padding: 4vh; border-radius: 3vh; pointer-events: auto; z-index: 500; 
        }
        #lib-grid, #shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15vh, 1fr)); gap: 2vh; overflow-y: auto; padding: 1vh; }
        
        .shop-item { background: rgba(255,255,255,0.05); border: 0.2vh solid #444; border-radius: 2vh; padding: 2vh; text-align: center; transition: 0.3s; }
        .shop-buy-btn { width: 100%; margin-top: 1vh; padding: 1vh; border: none; border-radius: 1vh; cursor: pointer; font-weight: bold; background: var(--gold); color: #000; font-size: 1rem; }
        .shop-buy-btn.locked { background: #444 !important; color: #888 !important; cursor: not-allowed; opacity: 0.7; }

        #msg { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 6vh; font-weight: 900; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 300; text-shadow: 0 0 2vh #fff; }
        
        .fever-active-ui { animation: fever-pulse 1s infinite; pointer-events: none; position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 50; display: none; }
        @keyframes fever-pulse {
            0% { box-shadow: inset 0 0 10vh rgba(255,0,0,0.2); }
            50% { box-shadow: inset 0 0 20vh rgba(255,200,0,0.4); }
            100% { box-shadow: inset 0 0 10vh rgba(255,0,0,0.2); }
        }

        .stats-table { width: 100%; border-collapse: collapse; margin-top: 1vh; font-size: 1.1rem; }
        .stats-table th, .stats-table td { border: 0.1vh solid #444; padding: 1.2vh; text-align: left; }
        .stats-table th { background: rgba(163,53,238,0.3); color: var(--gold); }

        .rainbow-card {
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000) !important;
            background-size: 400% 400% !important;
            animation: rainbow-bg 5s linear infinite !important;
            border: 0.3vh solid #fff !important;
            box-shadow: 0 0 1.5vh rgba(255,255,255,0.5);
        }
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rainbow-card * { text-shadow: 0.1vh 0.1vh 0.2vh #000; }
    </style>
</head>
<body>

<div id="fever-overlay" class="fever-active-ui"></div>

<div id="gui-layer">

        </div>
    </div>

    <div class="hud">
        <div style="color:var(--gold)"><span id="txt-cash">CASH</span>: <span class="hud-value">$<span id="money">0</span></span></div>

        <div id="mutation-timer-hud">Mutation Pod: Ready</div>
        <div id="fever-timer">Next Fever: --:--</div>
    </div>

    <button id="discard-btn" onclick="discardSelected()">🗑️ DISCARD FOR 50%</button>

    <div id="lib-window" class="window-base">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:2vh;">
            <div style="color:var(--gold); font-size:2.5rem; font-weight:bold;" id="txt-lib-title">COLLECTION</div>

        </div>
        <div id="lib-grid"></div>
    </div>

    <div id="shop-window" class="window-base">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:2vh;">
            <div style="color:var(--gold); font-size:2.5rem; font-weight:bold;" id="txt-shop-title">GALAXY SHOP</div>
            <button onclick="toggleShop()" style="background:var(--danger); color:white; border:none; padding:1.5vh 2vw; border-radius:1vh; cursor:pointer;" class="btn-close-ui">CLOSE</button>
        </div>
        <div id="shop-grid"></div>
    </div>

    <div id="stats-window" class="window-base">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:2vh;">
            <div style="color:var(--gold); font-size:2.5rem; font-weight:bold;" id="txt-stats-title">PROBABILITY / STATS</div>
            <button onclick="toggleStats()" style="background:var(--danger); color:white; border:none; padding:1.5vh 2vw; border-radius:1vh; cursor:pointer;" class="btn-close-ui">CLOSE</button>
        </div>
        <div style="overflow-y: auto;">
            <h3 style="color:var(--neon)" id="txt-spawn-prob">Spawn Probability</h3>
            <table class="stats-table" id="table-spawn"></table>

            <table class="stats-table" id="table-fever"></table>
            <h3 style="color:var(--lucky); margin-top:3vh;" id="txt-box-prob">Secret Box Contents</h3>
            <table class="stats-table" id="table-box"></table>
        </div>
    </div>

    <div class="collect-area">
        <button id="collect-all-btn" onclick="collectAll()">💰 <span id="txt-collect">COLLECT</span><br><span id="pending-sum" style="font-size:1.4rem;">$0</span></button>
    </div>

    <div id="msg">NEW!</div>

    <div class="controls">
        <div id="rebirth-cond" style="color:var(--gold); margin-bottom:1vh; font-size:1.1rem;">Cost: $100,000</div>
        <div id="rebirth-char-cond" style="color:var(--accent); margin-bottom:1.5vh; font-size:1rem; background:rgba(163,53,238,0.2); padding:1vh 2vw; border-radius:1.5vh; display:inline-block;">Required: ???</div>
        <br>
        <button id="rebirth-btn" onclick="rebirth()">🔄 <span id="txt-rebirth-btn">REBIRTH</span></button>
    </div>
</div>

            {e:"🔱", n:"Neptune"},{e:"⚔️", n:"Excalibur"},{e:"⛩️", n:"Gate"},{e:"🧿", n:"Oracle Eye"},{e:"🧬", n:"Genome"}

    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    });

    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<20000; i++) starPos.push((Math.random()-0.5)*10000, (Math.random()-0.5)*10000, (Math.random()-0.5)*10000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2}));
    scene.add(stars);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const conv = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 100), new THREE.MeshStandardMaterial({color: 0x151515}));
    conv.position.set(-28, 0, -8);

    for(let i=0; i<16; i++) {

        s.position.set(x, 0.5, z); s.userData = { slotIndex: i };
        scene.add(s); slotObjects.push(s);
    }
    camera.position.set(0, 35, 25); camera.lookAt(0, 0, -6);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        checkHover();
    });

    function checkHover() {
        raycaster.setFromCamera(mouse, camera);
        hoveredConveyorId = null;
        for (let g of conveyorGroups) { if (raycaster.intersectObjects(g.children).length > 0) { hoveredConveyorId = g.uuid; break; } }
        const hits = raycaster.intersectObjects(slotObjects);
        if (hits.length > 0) {
            const idx = hits[0].object.userData.slotIndex;
            const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
            if (idx < unlocked) hoveredIdx = idx; else hoveredIdx = -1;
        } else { hoveredIdx = -1; }
    }

    window.addEventListener('mousedown', (e) => {
        if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        raycaster.setFromCamera(mouse, camera);
        
        if(!isMutationMode) {
            for(let g of conveyorGroups){
                if(raycaster.intersectObjects(g.children).length>0){
                    if(g.userData.isBox) {
                        const empty = myItems.indexOf(null);
                        const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
                        if(empty === -1 || empty >= unlocked) {
                            showPopup(i18n[currentLang].msgNoSlots, "#ff4444");
                            return;
                        }
                        if(money >= g.userData.cost) {
                            money -= g.userData.cost;
                            playClick();
                            scene.remove(g); conveyorGroups = conveyorGroups.filter(x=>x!==g);
                            openBox();
                        } return;
                    }
                    const empty = myItems.indexOf(null);
                    const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
                    const mult = (rebirths === 5) ? 2 : (rebirths >= 6) ? 3 : 1;
                    if(money >= g.userData.cost && empty !== -1 && empty < unlocked){
                        money -= g.userData.cost; 
                        playClick();
                        myItems[empty] = {...g.userData, stored:0};
                        const finalVal = (g.userData.val * (g.userData.luckyMult || 1)) * mult;
                        
                        const libKey = g.userData.invasionType ? `${g.userData.e}_${g.userData.invasionType}` : g.userData.e;
                        if(!library[libKey] || finalVal > library[libKey].maxVal) {
                            library[libKey] = { 
                                n: g.userData.n, 
                                e: g.userData.e, 
                                maxVal: finalVal, 
                                isLucky: (g.userData.luckyMult > 1), 
                                luckyMult: g.userData.luckyMult,
                                invasionType: g.userData.invasionType
                            };
                        }
                        if(g.userData.luckyMult > 1) showPopup(i18n[currentLang].msgLucky, "#00ffff");
                        scene.remove(g); conveyorGroups = conveyorGroups.filter(x=>x!==g); refresh();
                    } return;
                }
            }
        }

        const hits = raycaster.intersectObjects(slotObjects);
        if(hits.length>0){
            const idx = hits[0].object.userData.slotIndex;
            const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
            if(idx >= unlocked) return;

            if(isMutationMode) {
                if(myItems[idx]) {
                    mutateCharacter(idx);
                } else {
                    isMutationMode = false;
                    showPopup("CANCELED", "#888");
                }
                return;
            }

            if(selectedIdx === -1){ if(myItems[idx]) selectedIdx = idx; } 
            else {
                if(idx === selectedIdx){ 
                    if(myItems[idx].stored > 0) playClick();
                    money += myItems[idx].stored; 
                    myItems[idx].stored = 0; 
                    selectedIdx = -1; 
                } 
                else { 
                    const temp = myItems[idx]; 
                    myItems[idx] = myItems[selectedIdx]; 
                    myItems[selectedIdx] = temp; 
                    selectedIdx = -1; 
                }
            }
            refresh();
        } else { 
            if(isMutationMode) { isMutationMode = false; showPopup("CANCELED", "#888"); }
            selectedIdx = -1; refresh(); 
        }
    });

    window.startMutationMode = () => {

        showPopup("SELECT CHARACTER TO MUTATE", "#e91e63");

    function mutateCharacter(idx) {
        const it = myItems[idx];
        if(it.isMutated) {
            showPopup("ALREADY MUTATED!", "#ff4444");
            isMutationMode = false;
            return;
        }

        const r = Math.random() * 100;
        let type = "blood", lMult = 1;
        
        if (r < 40) { type = "blood"; lMult = 1; }
        else if (r < 70) { type = "ice"; lMult = 1; }
        else if (r < 90) { type = "angel"; lMult = 1; }
        else if (r < 95) { type = null; lMult = 10 + Math.floor(Math.random()*40); }
        else if (r < 98) { type = "blood"; lMult = 10 + Math.floor(Math.random()*40); }
        else if (r < 99.9) { type = "ice"; lMult = 10 + Math.floor(Math.random()*40); }
        else { type = "angel"; lMult = 50 + Math.floor(Math.random()*50); }

        it.invasionType = type;
        it.luckyMult = Math.max(it.luckyMult, lMult);
        it.isMutated = true;
        lastMutationTime = Date.now();
        isMutationMode = false;

        const mult = (rebirths === 5) ? 2 : (rebirths >= 6) ? 3 : 1;
        const finalPPS = (it.val * it.luckyMult) * mult;
        const libKey = type ? `${it.e}_${type}` : it.e;
        if(!library[libKey] || finalPPS > library[libKey].maxVal) {
            library[libKey] = { n: it.n, e: it.e, maxVal: finalPPS, isLucky: (it.luckyMult > 1), luckyMult: it.luckyMult, invasionType: type };
        }

        playClick();
        showPopup(`MUTATION SUCCESS: ${type ? type.toUpperCase() : 'LUCKY'}!`, "#e91e63");
        refresh();
    }

    function spawn() {
        if(!isFeverActive) {
            normalSpawnCount++;
            if(normalSpawnCount >= 20) {
                spawnBox();
                normalSpawnCount = 0;
                return;
            }
        }
        const elapsed = (Date.now() - gameStartTime) / 1000, cycle = elapsed % FEVER_INTERVAL;
        const activeTable = isFeverActive ? feverChances : rarities;
        let isLucky = false;
        if(isFeverActive && !luckySpawnedInFever) { 
            const timeLeft = FEVER_DURATION - cycle;
            if(Math.random() < (1.0 / (timeLeft + 1)) || timeLeft < 5) { isLucky = true; luckySpawnedInFever = true; }
        }
        let rand = Math.random()*100, cum=0, r=activeTable[0];
        for(let x of activeTable){ cum+=x.chance; if(rand<=cum){ r=x; break; } }
        const list = charData[r.name];
        const d = list[Math.floor(Math.random()*list.length)];
        if(d.n === "Soccer Ball") { spawn(); return; }

        let variance = 0.85 + Math.random() * 0.3;
        let baseVal = Math.floor(r.baseValue * variance);
        
        if(currentInvasion) {
            baseVal *= invasionTypes[currentInvasion].mult;
        }

        if(r.name === "original") baseVal = 11111111 + Math.floor(Math.random() * (99999999 - 11111111));
        const finalCost = Math.floor(r.basePrice * (r.name === "original" ? 1 : variance));
        const luckyMult = isLucky ? (2 + Math.floor(Math.random()*49)) : 1;
        
        let emojiFilter = null;
        if(currentInvasion === "blood") emojiFilter = "#ff0000";
        if(currentInvasion === "ice")   emojiFilter = "#00ffff";
        if(currentInvasion === "angel") emojiFilter = "#ffffff";

        const g = new THREE.Group(); g.add(createEmoji(d.e, emojiFilter));
        const subTxt = isLucky ? `★LUCKY x${luckyMult}★ $${formatValue(finalCost)}` : `[${r.name}] $${formatValue(finalCost)} (+$${formatValue(baseVal)}/s)`;
        
        const libKey = currentInvasion ? `${d.e}_${currentInvasion}` : d.e;
        const displayName = library[libKey] ? `${d.n} ✔` : d.n;
        
        const lbl = createLabel(displayName, subTxt, isLucky ? "#00ffff" : r.color, isLucky); 
        lbl.position.y=7; lbl.material.opacity = 1; g.add(lbl);
        g.position.set(-28, 2.5, -55);
        const isRequired = rebirths < rebirthRequirements.length && rebirthRequirements[rebirths].includes(d.n);
        g.userData = { e:d.e, n:d.n, rKey:r.name, cost:finalCost, val:baseVal, luckyMult:luckyMult, offsetY: 0, isRequired, invasionType: currentInvasion };
        
        if(isRequired) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(4, 0.2, 16, 100), new THREE.MeshBasicMaterial({ color: 0xa335ee }));
            ring.rotation.x = Math.PI/2; g.add(ring);
            g.add(new THREE.PointLight(0xa335ee, 100, 15));
        }
        if(isLucky) {
            const aura = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.15, 8, 50), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
            aura.rotation.x = Math.PI/2; aura.position.y = -0.5; g.add(aura);
            g.userData.isLuckyEffect = true;
            showPopup("LUCKY INBOUND!", "#00ffff");
        } else if(r.name === "legend" || r.name === "secret" || r.name === "original") {
            g.add(new THREE.PointLight(r.color, 50, 20));
            const beam = new THREE.Mesh(new THREE.CylinderGeometry(1, 2, 50, 16, 1, true), new THREE.MeshBasicMaterial({ color: r.color, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
            beam.position.y = 20; g.add(beam); showPopup(`!! ${r.name} !!`, r.color);
        }
        scene.add(g); conveyorGroups.push(g);
    }

        const g = new THREE.Group(); g.add(createEmoji("📦"));
        const lbl = createLabel("SECRET BOX", `Buy for $${formatValue(cost)}?`, "#00ffff", true);
        lbl.position.y = 7; lbl.material.opacity = 1; g.add(lbl);

    function openBox() {
        if(Math.random() < 0.05 && rebirths < rebirthRequirements.length) {
            const reqs = rebirthRequirements[rebirths];
            const targetName = reqs[Math.floor(Math.random() * reqs.length)];
            let foundData = null, foundRar = null;
            for(let rk in charData) {
                const char = charData[rk].find(c => c.n === targetName);
                if(char) { foundData = char; foundRar = rk; break; }
            }
            if(foundData) { giveChar(foundRar, 1, targetName); showPopup("✨ REBIRTH HELPER !!", "#a335ee"); return; }
        }
        const r = Math.random() * 100;
        if(r < 40) { money += 5000; showPopup("+ $5,000 !!", "#0f8"); }
        else if(r < 60) { gameStartTime = Date.now() - (FEVER_INTERVAL * 1000); showPopup(i18n[currentLang].msgFever, "#ffeb3b"); }
        else if(r < 80) { giveChar("epic", 1); }
        else if(r < 88) { money *= 10; showPopup("💰 CASH x10 !!", "#ffeb3b"); }
        else if(r < 94) { giveChar("legend", 1); }
        else { giveChar("secret", 1); } 
    }

    function giveChar(rarName, luckyM, specificName = null) {
        const empty = myItems.indexOf(null);
        const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
        if(empty === -1 || empty >= unlocked) { showPopup(i18n[currentLang].msgNoSlots, "#ff4444"); return; }
        const list = charData[rarName];
        const d = specificName ? list.find(c => c.n === specificName) : list[Math.floor(Math.random()*list.length)];
        const rar = rarities.find(x => x.name === rarName);
        let baseVal = Math.floor(rar.baseValue);
        if(specificName === "Soccer Ball") baseVal = 1;
        if(rarName === "original") baseVal = 11111111 + Math.floor(Math.random() * (99999999 - 11111111));
        
        myItems[empty] = { 
            e:d.e, n:d.n, rKey:rarName, 
            cost: (specificName === "Soccer Ball" ? 0 : rar.basePrice), 
            val:baseVal, luckyMult:luckyM, stored:0,
            invasionType: null 
        };
        const mult = (rebirths === 5) ? 2 : (rebirths >= 6) ? 3 : 1;
        const finalVal = (baseVal * luckyM) * mult;
        if(!library[d.e] || finalVal > library[d.e].maxVal) library[d.e] = { n: d.n, e: d.e, maxVal: finalVal, isLucky: (luckyM > 1), luckyMult: luckyM };
        showPopup(`GOT ${d.n} !!`, rar.color); refresh();
    }

    function refresh() {
        const unlocked = (rebirths >= 4) ? 16 : 8 + rebirths * 2;
        const mult = (rebirths === 5) ? 2 : (rebirths >= 6) ? 3 : 1;
        
        slotObjects.forEach((s, i) => {
            if (i >= unlocked) s.material.color.setHex(0x050505);
            else if (selectedIdx === i) s.material.color.setHex(0x00ff88);
            else if (myItems[i]) s.material.color.set(myItems[i].luckyMult > 1 ? "#00ffff" : rarities.find(rar => rar.name === myItems[i].rKey).color);
            else s.material.color.setHex(0x222222);
        });

        myItems.forEach((it, i) => {
            const identity = it ? `${it.n}_${it.luckyMult}_${it.invasionType}_${it.isMutated}` : null;
            if (charIdentity[i] !== identity) {
                if (charInSlots[i]) { scene.remove(charInSlots[i]); charInSlots[i] = null; }
                if (it) {
                    const g = new THREE.Group();
                    let eCol = null;
                    if(it.invasionType === "blood") eCol = "#ff0000";
                    if(it.invasionType === "ice")   eCol = "#00ffff";
                    if(it.invasionType === "angel") eCol = "#ffffff";
                    
                    g.add(createEmoji(it.e, eCol));
                    const isL = it.luckyMult > 1;
                    const isRequired = rebirths < rebirthRequirements.length && rebirthRequirements[rebirths].includes(it.n);
                    const pps = (it.val * it.luckyMult) * mult;
                    const rarColor = rarities.find(r => r.name === it.rKey).color;
                    
                    let suffix = isL ? '★LUCKY★ ' : '';
                    if(it.invasionType) suffix += `[${it.invasionType.toUpperCase()}] `;
                    
                    const lbl = createLabel(it.n, `${suffix}+$${formatValue(pps)}/s`, isL ? "#00ffff" : rarColor, isL);
                    lbl.position.y = 7; g.add(lbl);
                    g.position.copy(slotObjects[i].position);
                    g.position.y = 4;
                    g.userData.isRequired = isRequired;
                    if (isRequired) {
                        const ring = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.15, 16, 100), new THREE.MeshBasicMaterial({ color: 0xa335ee }));
                        ring.rotation.x = Math.PI / 2; g.add(ring);
                        g.add(new THREE.PointLight(0xa335ee, 50, 10));
                    }
                    if (isL) {
                        const aura = new THREE.Mesh(new THREE.TorusGeometry(3, 0.1, 8, 32), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 }));
                        aura.rotation.x = Math.PI / 2; aura.position.y = -0.5; g.add(aura);
                        g.userData.isLuckyEffect = true;
                    }
                    scene.add(g);
                    charInSlots[i] = g;
                }
                charIdentity[i] = identity;
            }
        });
        
        const L = i18n[currentLang];
        document.getElementById('btn-archive').innerText = L.archive;
        document.getElementById('btn-shop').innerText = L.shop;
        document.getElementById('btn-stats').innerText = L.stats;
        document.getElementById('btn-full').innerText = L.full;
        document.getElementById('btn-reset').innerText = L.reset;
        document.getElementById('txt-cash').innerText = L.cash;
        document.getElementById('txt-rebirth-label').innerText = L.rebirth;
        document.getElementById('txt-collect').innerText = L.collect;
        document.getElementById('txt-lib-title').innerText = L.libTitle;
        document.getElementById('txt-shop-title').innerText = L.shopTitle;
        document.getElementById('txt-stats-title').innerText = L.statsTitle;
        document.getElementById('txt-spawn-prob').innerText = L.spawnProb;
        document.getElementById('txt-fever-prob').innerText = L.feverProb;
        document.getElementById('txt-box-prob').innerText = L.boxProb;
        document.getElementById('txt-rebirth-btn').innerText = L.rebirth;
        document.querySelectorAll('.btn-close-ui').forEach(b => b.innerText = L.close);
        document.getElementById('discard-btn').innerText = L.discard;

        document.getElementById('discard-btn').style.display = (selectedIdx !== -1 && myItems[selectedIdx]) ? 'block' : 'none';
        document.getElementById('rebirth-lv').innerText = (rebirths >= 6) ? "MAX" : rebirths;
        const reqArea = document.getElementById('rebirth-char-cond');
        if(rebirths < rebirthRequirements.length) {
            const reqs = rebirthRequirements[rebirths];
            const status = reqs.map(name => {
                const has = myItems.some(it => it && it.n === name);
                return `<span style="color:${has ? '#0f8' : '#ff4444'}">${has ? '✅' : '❌'}${name}</span>`;
            }).join(" ");
            reqArea.innerHTML = `${L.required}: ${status}`;
        } else { reqArea.innerText = L.maxRebirth; }
        save();
    }

    function createEmoji(e, fillColor = null){
        const canvas = document.createElement('canvas'); canvas.width=256; canvas.height=256;
        const ctx = canvas.getContext('2d'); ctx.font="220px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; 
        
        if(fillColor) {
            ctx.fillStyle = fillColor;
            ctx.fillText(e, 128, 128);
            ctx.globalCompositeOperation = 'source-in';
            ctx.fillRect(0,0,256,256);
        } else {
            ctx.fillText(e,128,128);
        }
        
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(canvas)}));
        sp.scale.set(5,5,1); return sp;
    }
    function createLabel(t1, t2, color, isLucky){
        const canvas = document.createElement('canvas'); canvas.width=600; canvas.height=200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.strokeStyle=color; ctx.lineWidth=10; ctx.roundRect(5,5,590,190,20); ctx.fill(); ctx.stroke();
        ctx.fillStyle="white"; ctx.textAlign="center"; ctx.font="bold 45px Arial"; ctx.fillText(t1, 300, 80);
        ctx.fillStyle=color; ctx.font="bold 35px Arial"; ctx.fillText(t2, 300, 150);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(canvas), transparent:true, opacity: 0}));
        sp.scale.set(9,3,1); if(isLucky) sp.userData = { canvas, ctx, t1, t2 }; return sp;
    }

    function animate(t) {
        requestAnimationFrame(animate);
        const rainbow = `hsl(${t % 360}, 100%, 70%)`;
        conveyorGroups.forEach((g,i)=>{ 
            g.position.z += 0.1; if(g.position.z > 50){ scene.remove(g); conveyorGroups.splice(i,1); return; }
            const isH = (hoveredConveyorId === g.uuid);
            let bounce = 0;
            if(g.userData.isRequired) {
                bounce = Math.abs(Math.sin(t * 0.005)) * 2;
                const ring = g.children.find(c => c.geometry && c.geometry.type === "TorusGeometry");
                if(ring) ring.rotation.z += 0.05;
            }
            g.userData.offsetY += ((isH ? 3.0 : 0) - g.userData.offsetY) * 0.15;
            g.children[0].position.y = g.userData.offsetY + bounce;
            g.children[1].position.y = 8 + g.userData.offsetY + bounce;
            if(g.userData.isLuckyEffect && g.children[1].material.map) updateRainbowLabel(g.children[1], rainbow);
        });
        const mult = (rebirths === 5) ? 2 : (rebirths >= 6) ? 3 : 1;
        const isTick = (t - lastIncomeTick >= 1000);
        let pending = 0, currentPPS = 0;
        charInSlots.forEach((g,i)=>{
            if(g && myItems[i]){
                if(isTick) myItems[i].stored += (myItems[i].val * myItems[i].luckyMult) * mult;
                pending += myItems[i].stored; currentPPS += (myItems[i].val * myItems[i].luckyMult) * mult;
                const isS = (selectedIdx === i), isH = (hoveredIdx === i);
                let bounce = 0;
                // --- スロット内のキャラがリバース条件であっても跳ねないように修正 ---
                if(g.userData.isRequired) {
                    bounce = 0; // 以前は Math.abs(Math.sin(t * 0.005)) * 1.5; だったが、通常種と同様に固定
                    const ring = g.children.find(c => c.type === "Mesh" && c.geometry.type === "TorusGeometry");
                    if(ring) ring.rotation.z += 0.05;
                }
                g.position.y += ((4 + (isH || isS ? 2 : 0) + bounce) - g.position.y) * 0.15;
                g.children[1].material.opacity += ((isH || isS ? 1 : 0) - g.children[1].material.opacity) * 0.15;
                if(g.userData.isLuckyEffect && g.children[1].material.map) updateRainbowLabel(g.children[1], rainbow);
            }
        });
        const now = Date.now();
        const elapsed = (now - gameStartTime) / 1000, cycle = elapsed % FEVER_INTERVAL;
        const fTimer = document.getElementById('fever-timer');
        const L = i18n[currentLang];
        if (cycle < FEVER_DURATION) {
            if(!isFeverActive) { 
                isFeverActive = true; 
                luckySpawnedInFever = false; 
                if(Math.random() < 0.2) {
                    let r = Math.random();
                    if(r < 0.5) currentInvasion = "blood";
                    else if(r < 0.9) currentInvasion = "ice";
                    else currentInvasion = "angel";
                    showPopup(`${invasionTypes[currentInvasion].name} INVASION !!`, invasionTypes[currentInvasion].color);
                } else {
                    currentInvasion = null;
                    showPopup(L.msgFever, "#ffeb3b"); 
                }
            }
            const timeStr = currentInvasion ? `💀 ${invasionTypes[currentInvasion].name}: ` : `🔥 FEVER: `;
            fTimer.innerText = `${timeStr}${Math.ceil(FEVER_DURATION - cycle)}s`;
            fTimer.style.color = currentInvasion ? invasionTypes[currentInvasion].color : "#ffeb3b";
            document.getElementById('fever-overlay').style.display = 'block';
            let targetBG = currentInvasion ? invasionTypes[currentInvasion].bg : 0x330011;
            scene.background.lerp(new THREE.Color(targetBG), 0.05); 
        } else {
            if(isFeverActive) { isFeverActive = false; currentInvasion = null; }
            const next = Math.ceil(FEVER_INTERVAL - cycle);
            fTimer.innerText = `${L.nextFever}: ${Math.floor(next/60)}:${(next%60).toString().padStart(2,'0')}`;
            fTimer.style.color = "#888";
            document.getElementById('fever-overlay').style.display = 'none';
            const targetColor = new THREE.Color((shopItems.find(x => x.id === currentDecor) || { color: 0x020205 }).color);
            scene.background.lerp(targetColor, 0.05);
        }

        const mutHud = document.getElementById('mutation-timer-hud');
        const mutBtn = document.getElementById('btn-mutate');
        const wait = 30 * 60 * 1000;
        const mutDiff = now - lastMutationTime;
        if(mutDiff < wait) {
            const rem = Math.ceil((wait - mutDiff) / 1000);
            const m = Math.floor(rem / 60);
            const s = rem % 60;
            const timeText = `Wait: ${m}:${s.toString().padStart(2, '0')}`;
            mutHud.innerText = `Mutation Pod: ${timeText}`;
            mutHud.style.color = "#ff4444";
            mutBtn.style.background = "#222";
            mutBtn.style.color = "#555";
            mutBtn.innerText = `🧬 ${timeText}`;
            mutBtn.disabled = true;
        } else {
            mutHud.innerText = `Mutation Pod: Ready`;
            mutHud.style.color = "#e91e63";
            mutBtn.style.background = "#e91e63";
            mutBtn.style.color = "white";
            mutBtn.innerText = `🧬 MUTATION POD`;
            mutBtn.disabled = false;
        }

        document.getElementById('box-timer').innerText = `${L.secretBox}: ${normalSpawnCount} / 20`;
        if(isTick) lastIncomeTick = t;
        document.getElementById('money').innerText = formatValue(money);
        document.getElementById('pps').innerText = formatValue(currentPPS);
        document.getElementById('pending-sum').innerText = `$${formatValue(pending)}`;
        const rebirthCost = Math.pow(10, rebirths+5);
        document.getElementById('rebirth-cond').innerText = (rebirths >= 6) ? L.maxRebirth : `Next Rebirth: $${formatValue(rebirthCost)}`;
        let canR = (rebirths < 6) && (money >= rebirthCost) && (rebirths < rebirthRequirements.length) && rebirthRequirements[rebirths].every(name => myItems.some(it => it && it.n === name));
        document.getElementById('rebirth-btn').className = canR ? 'available' : 'locked';
        document.getElementById('rebirth-btn').disabled = !canR;
        if(t - lastS > (isFeverActive ? 1500 : 3500)){ if(!isMutationMode) spawn(); lastS=t; }
        renderer.render(scene, camera);
        
        if(document.getElementById('shop-window').style.display === 'flex') {
            const buttons = document.querySelectorAll('.shop-buy-btn:not(.bought):not(.free-btn)');
            buttons.forEach(btn => {
                const costAttr = btn.getAttribute('data-cost');
                if(costAttr) {
                    const cost = parseInt(costAttr);
                    if(money < cost) { btn.classList.add('locked'); btn.disabled = true; }
                    else { btn.classList.remove('locked'); btn.disabled = false; }
                }
            });
        }
    }

    function updateRainbowLabel(sp, color) {
        if(!sp.userData.canvas) return;
        const { canvas, ctx, t1, t2 } = sp.userData;
        ctx.clearRect(0, 0, 600, 200);
        ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.strokeStyle=color; ctx.lineWidth=10; ctx.roundRect(5,5,590,190,20); ctx.fill(); ctx.stroke();
        ctx.fillStyle="white"; ctx.textAlign="center"; ctx.font="bold 45px Arial"; ctx.fillText(t1, 300, 80);
        ctx.fillStyle=color; ctx.font="bold 35px Arial"; ctx.fillText(t2, 300, 150);
        sp.material.map.needsUpdate = true;
    }

    function applyDecor(id) { currentDecor = id; }
    window.buyDecor = (id, cost) => {
        if (money >= cost) {
            money -= cost; ownedDecor.push(id); playClick(); showPopup("PURCHASED!", "#ffeb3b"); renderShop(); refresh();
        } else { showPopup("NOT ENOUGH CASH!", "#ff4444"); }
    };
    window.useDecor = (id) => { applyDecor(id); playClick(); renderShop(); save(); };

    window.toggleSettings = () => { const m = document.getElementById('settings-menu'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
    window.toggleFullscreen = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); toggleSettings(); };
    window.resetGame = () => { if(confirm("RESET ALL?")) { localStorage.clear(); location.reload(); } };
    window.discardSelected = () => { if(selectedIdx !== -1 && myItems[selectedIdx]) { playClick(); money += Math.floor(myItems[selectedIdx].cost / 2); myItems[selectedIdx] = null; selectedIdx = -1; refresh(); showPopup(i18n[currentLang].msgSold, "#ff4444"); } };
    window.rebirth = () => { const cost = Math.pow(10, rebirths+5); if(money >= cost) { playClick(); money = 1000; rebirths++; myItems.fill(null); refresh(); showPopup("DIMENSION UP!", "#a335ee"); } };
    window.collectAll = () => { 
        let earned = 0;
        myItems.forEach(it=>{ if(it && it.stored > 0){ earned += it.stored; money+=it.stored; it.stored=0; } }); 
        if(earned > 0) playClick(); refresh(); 
    };

    window.getFreeBall = () => { giveChar("normal", 1, "Soccer Ball"); showPopup("RESCUE BALL!", "#0f8"); };

    window.toggleStats = () => {
        const w = document.getElementById('stats-window');
        w.style.display = w.style.display==='flex'?'none':'flex';
        if(w.style.display==='flex') renderStats();
    };

    function renderStats() {
        const L = i18n[currentLang];
        const tableSpawn = document.getElementById('table-spawn');
        tableSpawn.innerHTML = `<tr><th>${L.rarity}</th><th>${L.chance}</th></tr>`;
        rarities.forEach(r => { tableSpawn.innerHTML += `<tr><td style="color:${r.color}">${r.name.toUpperCase()}</td><td>${r.chance}%</td></tr>`; });
        const tableFever = document.getElementById('table-fever');
        tableFever.innerHTML = `<tr><th>${L.rarity}</th><th>${L.chance}</th></tr>`;
        feverChances.forEach(r => { tableFever.innerHTML += `<tr><td style="color:${r.color}">${r.name.toUpperCase()}</td><td>${r.chance}%</td></tr>`; });
        const tableBox = document.getElementById('table-box');
        tableBox.innerHTML = `<tr><th>${L.item}</th><th>${L.chance}</th></tr>`;
        const boxContents = [
            { n: "+$5,000 Cash", p: "40%" }, { n: "Instant Fever", p: "20%" }, { n: "Epic Character", p: "20%" }, { n: "Cash x10", p: "8%" }, { n: "Legend Character", p: "6%" }, { n: "Secret Character", p: "6%" }, { n: "✨ Rebirth Helper", p: "5% (Special)" }
        ];
        boxContents.forEach(c => { tableBox.innerHTML += `<tr><td>${c.n}</td><td>${c.p}</td></tr>`; });
    }

    function renderLib() {
        const grid = document.getElementById('lib-grid'); grid.innerHTML='';
        rarities.forEach(rar => { charData[rar.name].forEach(d => { const found = library[d.e]; addCard(grid, d, rar, found); }); });
        const invHeader = document.createElement('div');
        invHeader.style.cssText = "grid-column: 1/-1; color:var(--danger); font-size:2rem; margin-top:3vh; border-bottom:1px solid #600;";
        invHeader.innerText = "INVASION COLLECTION";
        grid.appendChild(invHeader);
        ["blood", "ice", "angel"].forEach(invType => {
            const data = invasionTypes[invType];
            rarities.forEach(rar => { charData[rar.name].forEach(d => { const key = `${d.e}_${invType}`; const found = library[key]; addCard(grid, d, {name: invType.toUpperCase(), color: data.color}, found, invType); }); });
        });
    }

    function addCard(grid, d, rar, found, invType = null) {
        const div = document.createElement('div');
        const isLucky = found && found.isLucky;
        const cardClass = isLucky ? 'rainbow-card' : '';
        let borderColor = found ? (isLucky ? 'transparent' : rar.color) : '#333';
        let bgColor = found ? (isLucky ? 'transparent' : rar.color + '4D') : 'rgba(255,255,255,0.03)';
        div.className = cardClass;
        div.style.cssText = `background: ${bgColor}; aspect-ratio:1/1.2; border-radius:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:0.3vh solid ${borderColor}; position:relative; transition: 0.3s;`;
        const luckyTag = (found && isLucky) ? `<div style="font-size:0.7rem; color:#fff; position:absolute; bottom:0.5vh; right:0.8vh; font-weight:bold; background:rgba(0,0,0,0.5); padding:2px 5px; border-radius:5px;">x${found.luckyMult}</div>` : '';
        let filterStyle = "";
        if(found) {
            if(invType === "blood") filterStyle = "filter: sepia(1) saturate(100) hue-rotate(-50deg);";
            if(invType === "ice")   filterStyle = "filter: sepia(1) saturate(100) hue-rotate(140deg);";
            if(invType === "angel") filterStyle = "filter: brightness(2) contrast(0) brightness(2);";
        } else { filterStyle = "filter:brightness(0);"; }
        div.innerHTML = `<div style="font-size:0.7rem; color:${found ? '#fff' : rar.color}; position:absolute; top:0.8vh; font-weight:bold;">${rar.name.toUpperCase()}</div><div style="font-size:3.5vh; ${filterStyle}">${d.e}</div><div style="font-size:0.8rem; color:#fff; font-weight:bold; margin-top:0.5vh;">${found ? d.n : '???'}</div><div style="font-size:0.7rem; color:var(--gold); margin-top:0.3vh;">${found ? '$'+formatValue(found.maxVal)+'/s' : '---'}</div>${luckyTag}`;
        grid.appendChild(div);
    }

    function renderShop() {
        const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
        const ballDiv = document.createElement('div'); ballDiv.className = 'shop-item'; ballDiv.style.borderColor = 'var(--neon)';
        ballDiv.innerHTML = `<div style="font-size:3vh; margin-bottom:0.5vh;">⚽</div><h3 style="font-size:1rem; margin:0.5vh 0; color:var(--neon);">Soccer Ball</h3><p style="font-size:0.8rem; color:#aaa; margin:0.5vh 0;">Rescue: $1/s<br>FREE FOREVER</p><button class="shop-buy-btn free-btn" style="background:var(--neon);" onclick="getFreeBall()">FREE GET</button>`;
        grid.appendChild(ballDiv);
        const defDiv = document.createElement('div'); defDiv.className = 'shop-item';
        defDiv.innerHTML = `<h3>Normal Space</h3><p>Default</p><button class="shop-buy-btn ${currentDecor==='default'?'bought':''}" onclick="useDecor('default')">${currentDecor==='default'?'ACTIVE':'USE'}</button>`;
        grid.appendChild(defDiv);
        shopItems.forEach(item => {
            const isOwned = ownedDecor.includes(item.id); const canAfford = money >= item.cost; const div = document.createElement('div'); div.className = 'shop-item';
            div.innerHTML = `<div style="width:100%; height:4vh; background-color:#${item.color.toString(16).padStart(6,'0')}; border-radius:1vh; margin-bottom:1vh;"></div><h3 style="font-size:1rem; margin:0.5vh 0;">${item.name}</h3><p style="font-size:0.8rem; color:#aaa; margin:0.5vh 0;">${item.desc}</p>${isOwned ? `<button class="shop-buy-btn ${currentDecor===item.id?'bought':''}" onclick="useDecor('${item.id}')">${currentDecor===item.id?'ACTIVE':'USE'}</button>` : `<button class="shop-buy-btn ${!canAfford?'locked':''}" data-cost="${item.cost}" ${!canAfford?'disabled':''} onclick="buyDecor('${item.id}', ${item.cost})">$${formatValue(item.cost)}</button>`}`;
            grid.appendChild(div);
        });
    }

    window.toggleLib = () => { const w = document.getElementById('lib-window'); w.style.display = w.style.display==='flex'?'none':'flex'; if(w.style.display==='flex') renderLib(); };
    window.toggleShop = () => { const w = document.getElementById('shop-window'); w.style.display = w.style.display==='flex'?'none':'flex'; if(w.style.display==='flex') renderShop(); };
    function showPopup(t, c){ const e=document.getElementById('msg'); e.innerText=t; e.style.color=c; e.style.opacity=1; setTimeout(()=>e.style.opacity=0,1500); }
    function save(){ localStorage.setItem('tycoon_save_mut', JSON.stringify({money, rebirths, myItems, library, gameStartTime, normalSpawnCount, ownedDecor, currentDecor, lastMutationTime, bgmVol: bgm.volume, seVol: clickSound.volume})); }
    function load(){ 
        const d=JSON.parse(localStorage.getItem('tycoon_save_mut')); 
        if(d){ 
            money=d.money; rebirths=d.rebirths; myItems=d.myItems; library=d.library||{}; 
            gameStartTime=d.gameStartTime||Date.now(); normalSpawnCount=d.normalSpawnCount||0; 
            ownedDecor=d.ownedDecor||["default"]; currentDecor=d.currentDecor||"default"; 
            lastMutationTime=d.lastMutationTime||0;
            if(d.bgmVol !== undefined) { bgm.volume = d.bgmVol; document.getElementById('bgm-slider').value = d.bgmVol; document.getElementById('bgm-val').innerText = Math.floor(d.bgmVol * 100) + "%"; }
            if(d.seVol !== undefined) { clickSound.volume = d.seVol; document.getElementById('se-slider').value = d.seVol; document.getElementById('se-val').innerText = Math.floor(d.seVol * 100) + "%"; }
        } 
        refresh(); 
    }

    load(); animate(0);
</script>
</body>
</html>
